name: Compilar Korreturnos para iPhone (iOS .ipa)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_ios:
    name: Compilar IPA sin firma en macOS
    runs-on: macos-latest

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Instalar Flutter estable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 3. Instalar dependencias de Flutter y CocoaPods
        run: |
          flutter pub get
          cd ios
          pod install

      - name: 4. Compilar Korreturnos (Versión Completa Conductor) para iOS
        run: |
          flutter build ios --release --no-codesign -t lib/main.dart
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 Korreturnos.ipa Payload
          rm -rf Payload

      - name: 5. Compilar Korreturnos-Familiar para iOS
        run: |
          flutter build ios --release --no-codesign -t lib/main_familiar.dart
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 Korreturnos-Familiar.ipa Payload
          rm -rf Payload

      - name: 6. Subir archivos .ipa listos para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Korreturnos-iPhone-IPAs
          path: |
            Korreturnos.ipa
            Korreturnos-Familiar.ipa
          retention-days: 30
